name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The tag is the release; the version in pyproject is what people install.
      # Disagreement between the two is how a release ends up unreproducible, so
      # it fails here rather than shipping.
      - name: The tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import tomllib,pathlib; \
              print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $packaged" >&2
            exit 1
          fi
          echo "releasing $packaged"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      # The same assertion CI makes on every push. Repeated here because this is
      # the artefact people install, and a wheel that lost the templates still
      # imports and fails at the moment somebody runs `generate`.
      - name: The wheel carries the firmware templates
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          templates = [n for n in names if "firmware/templates/" in n]
          assert len(templates) >= 9, f"only {len(templates)} templates in {wheel.name}"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing"
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # A trusted publisher: PyPI verifies this workflow's OIDC identity, so there
    # is no long-lived token in the repository to leak or rotate. Configure it at
    # pypi.org/manage/project/pinside/settings/publishing with
    # owner=bitcrushtesting, repository=pinside, workflow=release.yml,
    # environment=pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/pinside
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: Publish the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The section for this version, not merely the first one: the first
          # is [Unreleased], which is never what a release should quote.
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            /^## \[/ { if (found) exit; found = ($0 ~ "\\[" v "\\]"); next }
            found' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md.}"
